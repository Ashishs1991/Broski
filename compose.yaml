# Local development only; never publish these services directly to the internet.
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: broski
      POSTGRES_USER: broski
      POSTGRES_PASSWORD: ${PGPASSWORD:?Set PGPASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U broski -d broski"]
      interval: 5s
      timeout: 3s
      retries: 12
  migrate:
    image: flyway/flyway:13.6.0
    command: migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://db:5432/broski
      FLYWAY_USER: broski
      FLYWAY_PASSWORD: ${PGPASSWORD:?Set PGPASSWORD in .env}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      FLYWAY_DEFAULT_SCHEMA: flyway_history
      FLYWAY_SCHEMAS: flyway_history
      FLYWAY_CLEAN_DISABLED: "true"
      FLYWAY_BASELINE_ON_MIGRATE: "false"
      FLYWAY_VALIDATE_MIGRATION_NAMING: "true"
    volumes:
      - ./infra/migrations:/flyway/sql:ro
    depends_on:
      db:
        condition: service_healthy
  api:
    build: ./backend
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: broski
      PGUSER: broski
      PGPASSWORD: ${PGPASSWORD:?Set PGPASSWORD in .env}
      BROSKI_DEV_TOKEN: ${BROSKI_DEV_TOKEN:?Set BROSKI_DEV_TOKEN in .env}
      BROSKI_DEV_OWNER_ID: ${BROSKI_DEV_OWNER_ID:-local-owner}
      BROSKI_STORAGE_ROOT: /data
      BROSKI_MAX_UPLOAD_BYTES: ${BROSKI_MAX_UPLOAD_BYTES:-52428800}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    read_only: true
    mem_limit: 1g
    cpus: "2.0"
    tmpfs:
      - /tmp:size=268435456
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: broski
      PGUSER: broski
      PGPASSWORD: ${PGPASSWORD:?Set PGPASSWORD in .env}
      BROSKI_STORAGE_ROOT: /data
      BROSKI_MAX_PAGES: ${BROSKI_MAX_PAGES:-300}
    volumes:
      - ./data:/data:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  postgres_data:
